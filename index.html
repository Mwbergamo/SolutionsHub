<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolutionsHub</title>
<meta name="description" content="CodeBlue Technology solutions-consulting quoting tool.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app-root"></div>

<!--
  The full ported template markup lives here as inert text (type is not
  "text/html" or empty, so the browser never parses or executes it — no
  image fetches, no attribute-triggered event handlers). runtime.js reads
  this element's textContent, parses it into a real (detached) DOM subtree,
  compiles it once, and mounts a live instance into #app-root. See
  runtime.js for how the sc-if / sc-for / {{}} syntax below is interpreted.
-->
<script type="text/x-template" id="app-template">
<div class="app-shell" style="background:oklch(0.15 0.028 255);display:flex;flex-direction:column;font-family:'IBM Plex Sans',sans-serif;overflow:hidden;position:relative;height:100vh;width:100%;">

  <!-- Header -->
  <div class="app-header" style="flex:0 0 84px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:oklch(0.12 0.026 255);border-bottom:1px solid oklch(0.24 0.03 255);">
    <div style="display:flex;align-items:center;gap:22px;">
      <div style="display:flex;align-items:center;gap:10px;cursor:pointer;" data-on-click="{{goOverview}}">
        <img src="{{logoWhite}}" alt="CodeBlue Technology" style="height:34px;width:auto;object-fit:contain;" />
      </div>
      <sc-if value="{{showBreadcrumb}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;align-items:center;gap:8px;color:oklch(0.55 0.02 255);font-size:14px;">
          <span>/</span>
          <span style="color:oklch(0.8 0.01 255);">{{breadcrumb}}</span>
        </div>
      </sc-if>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="call-experience.html" style="display:flex;align-items:center;gap:8px;background:none;border:1px solid oklch(0.32 0.03 255);color:oklch(0.85 0.01 255);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;text-decoration:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        Zultys Call Experience Configurator
      </a>
      <button data-on-click="{{openSummary}}" style="display:flex;align-items:center;gap:8px;background:oklch(0.2 0.03 255);border:1px solid oklch(0.32 0.03 255);color:white;font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"></path><circle cx="9.5" cy="21" r="1"></circle><circle cx="17.5" cy="21" r="1"></circle></svg>
        Solution
        <span style="background:{{accentColor}};color:white;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px;">{{selectionCount}}</span>
      </button>
    </div>
  </div>

  <!-- Body (scrollable) -->
  <div class="app-body" style="flex:1;overflow-y:auto;overflow-x:hidden;">

    <!-- OVERVIEW -->
    <sc-if value="{{isOverview}}" hint-placeholder-val="{{true}}">
      <div class="view-pad" style="padding:44px 56px 40px;">
        <div style="font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;color:white;max-width:680px;line-height:1.15;">What can we build for you today?</div>
        <div style="margin-top:10px;font-size:15px;color:oklch(0.6 0.02 255);max-width:620px;">Start wide, then tap into whatever's relevant to this conversation. Nothing here commits to anything — it's a starting point to think through together.</div>

        <div style="margin-top:28px;max-width:640px;position:relative;">
          <div style="display:flex;align-items:center;gap:10px;background:oklch(0.98 0.006 255);border-radius:999px;padding:6px 8px 6px 20px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 255)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input value="{{searchQuery}}" data-on-input="{{onSearchInput}}" data-on-keydown="{{onSearchKeyDown}}" placeholder="Search services — try “help desk” or “cameras”…" style="flex:1;border:none;outline:none;background:transparent;font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:oklch(0.2 0.03 255);padding:12px 0;">
            <sc-if value="{{searchHasQuery}}" hint-placeholder-val="{{false}}">
              <button data-on-click="{{onClearSearch}}" aria-label="Clear search" style="width:28px;height:28px;flex:0 0 auto;border-radius:999px;border:none;background:oklch(0.9 0.006 255);color:oklch(0.4 0.02 255);font-size:14px;font-weight:700;cursor:pointer;line-height:1;">×</button>
            </sc-if>
            <sc-if value="{{voiceSupported}}" hint-placeholder-val="{{false}}">
              <button data-on-click="{{onVoiceClick}}" aria-label="Search by voice" style="{{voiceButtonStyle}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
              </button>
            </sc-if>
          </div>

          <sc-if value="{{voiceListening}}" hint-placeholder-val="{{false}}">
            <div style="margin-top:8px;font-size:12.5px;color:{{accentColor}};font-weight:600;">🎙️ Listening…</div>
          </sc-if>

          <sc-if value="{{searchHasQuery}}" hint-placeholder-val="{{false}}">
            <div style="position:absolute;top:calc(100% + 8px);left:0;right:0;background:oklch(0.98 0.006 255);border-radius:16px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,0.45);max-height:320px;overflow-y:auto;z-index:20;">
              <sc-if value="{{searchHasResults}}" hint-placeholder-val="{{false}}">
                <sc-for list="{{searchResults}}" as="r" hint-placeholder-count="3">
                  <div data-on-click="{{r.onClick}}" style="padding:12px 14px;border-radius:10px;cursor:pointer;">
                    <div style="font-size:14px;font-weight:700;color:oklch(0.2 0.03 255);">{{r.label}}</div>
                    <div style="margin-top:2px;font-size:12px;color:oklch(0.5 0.02 255);">{{r.breadcrumb}}</div>
                  </div>
                </sc-for>
              </sc-if>
              <sc-if value="{{searchNoResults}}" hint-placeholder-val="{{false}}">
                <div style="padding:16px 14px;font-size:13.5px;color:oklch(0.5 0.02 255);">No matches — try a service name like “VoIP” or “cameras”.</div>
              </sc-if>
            </div>
          </sc-if>
        </div>

        <div style="margin-top:36px;display:flex;flex-wrap:wrap;gap:24px;justify-content:flex-start;">

          <div data-on-click="{{goToIT}}" style="width:322px;height:206px;background:oklch(0.98 0.006 255);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="width:46px;height:46px;border-radius:13px;background:{{accentColor}};display:flex;align-items:center;justify-content:center;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
              </div>
              <sc-if value="{{itHasSelections}}" hint-placeholder-val="{{false}}">
                <div style="background:{{accentColor}};color:white;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;">{{itSelectedCount}} selected</div>
              </sc-if>
            </div>
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:oklch(0.2 0.03 255);">IT Services</div>
              <div style="margin-top:6px;font-size:13px;line-height:1.4;color:oklch(0.45 0.02 255);">Your dedicated IT department — support, protection, and strategy in one place.</div>
            </div>
            <div style="font-size:11.5px;color:oklch(0.55 0.02 255);font-weight:700;letter-spacing:.03em;">7 SERVICE AREAS →</div>
          </div>

          <div data-on-click="{{goToDC}}" style="width:322px;height:206px;background:oklch(0.98 0.006 255);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="width:46px;height:46px;border-radius:13px;background:{{accentColor}};display:flex;align-items:center;justify-content:center;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="6.5" rx="1.4"></rect><rect x="4" y="14.5" width="16" height="6.5" rx="1.4"></rect><circle cx="8" cy="6.25" r="0.9" fill="white" stroke="none"></circle><circle cx="8" cy="17.75" r="0.9" fill="white" stroke="none"></circle></svg>
              </div>
              <sc-if value="{{dcHasSelections}}" hint-placeholder-val="{{false}}">
                <div style="background:{{accentColor}};color:white;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;">{{dcSelectedCount}} selected</div>
              </sc-if>
            </div>
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:oklch(0.2 0.03 255);">Data Center Services</div>
              <div style="margin-top:6px;font-size:13px;line-height:1.4;color:oklch(0.45 0.02 255);">Cloud, hosting, connectivity, and recovery built for uptime.</div>
            </div>
            <div style="font-size:11.5px;color:oklch(0.55 0.02 255);font-weight:700;letter-spacing:.03em;">5 SERVICE AREAS →</div>
          </div>

          <div data-on-click="{{goToVoIP}}" style="width:322px;height:206px;background:oklch(0.98 0.006 255);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="width:46px;height:46px;border-radius:13px;background:{{accentColor}};display:flex;align-items:center;justify-content:center;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1.5a8 8 0 0 1 16 0V13"></path><rect x="2" y="13" width="4.5" height="7" rx="2"></rect><rect x="17.5" y="13" width="4.5" height="7" rx="2"></rect></svg>
              </div>
              <sc-if value="{{voipHasSelections}}" hint-placeholder-val="{{false}}">
                <div style="background:{{accentColor}};color:white;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;">{{voipSelectedCount}} selected</div>
              </sc-if>
            </div>
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:oklch(0.2 0.03 255);">Voice over IP Services</div>
              <div style="margin-top:6px;font-size:13px;line-height:1.4;color:oklch(0.45 0.02 255);">Phone systems, call center, and conference rooms that just work.</div>
            </div>
            <div style="font-size:11.5px;color:oklch(0.55 0.02 255);font-weight:700;letter-spacing:.03em;">6 SERVICE AREAS →</div>
          </div>

          <div data-on-click="{{goToCabling}}" style="width:322px;height:206px;background:oklch(0.98 0.006 255);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="width:46px;height:46px;border-radius:13px;background:{{accentColor}};display:flex;align-items:center;justify-content:center;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7L4 10a4 4 0 0 0 0 5.5l0.5 0.5a4 4 0 0 0 5.5 0L13 13"></path><path d="M17 17l3-3a4 4 0 0 0 0-5.5l-0.5-0.5a4 4 0 0 0-5.5 0L11 11"></path></svg>
              </div>
              <sc-if value="{{cablingHasSelections}}" hint-placeholder-val="{{false}}">
                <div style="background:{{accentColor}};color:white;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;">{{cablingSelectedCount}} selected</div>
              </sc-if>
            </div>
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:oklch(0.2 0.03 255);">Data Cabling</div>
              <div style="margin-top:6px;font-size:13px;line-height:1.4;color:oklch(0.45 0.02 255);">Structured cabling, data closets, and documentation done right.</div>
            </div>
            <div style="font-size:11.5px;color:oklch(0.55 0.02 255);font-weight:700;letter-spacing:.03em;">5 SERVICE AREAS →</div>
          </div>

          <div data-on-click="{{goToSecurity}}" style="width:322px;height:206px;background:oklch(0.98 0.006 255);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="width:46px;height:46px;border-radius:13px;background:{{accentColor}};display:flex;align-items:center;justify-content:center;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6l7-3z"></path></svg>
              </div>
              <sc-if value="{{securityHasSelections}}" hint-placeholder-val="{{false}}">
                <div style="background:{{accentColor}};color:white;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;">{{securitySelectedCount}} selected</div>
              </sc-if>
            </div>
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:oklch(0.2 0.03 255);">Premise Security</div>
              <div style="margin-top:6px;font-size:13px;line-height:1.4;color:oklch(0.45 0.02 255);">Cameras and access control, installed and monitored.</div>
            </div>
            <div style="font-size:11.5px;color:oklch(0.55 0.02 255);font-weight:700;letter-spacing:.03em;">4 SERVICE AREAS →</div>
          </div>

        </div>
      </div>
    </sc-if>

    <!-- PILLAR DRILL-DOWN -->
    <sc-if value="{{isPillar}}" hint-placeholder-val="{{false}}">
      <div class="view-pad" style="padding:36px 56px 40px;">
        <div style="display:flex;align-items:center;gap:14px;">
          <div data-on-click="{{backToOverview}}" style="width:36px;height:36px;border-radius:999px;background:oklch(0.22 0.03 255);display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </div>
          <div style="font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;color:white;">{{currentPillar.name}}</div>
        </div>
        <div style="margin-top:8px;margin-left:50px;font-size:14px;color:oklch(0.62 0.02 255);max-width:680px;">{{currentPillar.tagline}}</div>

        <div style="margin-top:26px;margin-left:50px;display:flex;flex-direction:column;gap:10px;max-width:820px;">
          <sc-for list="{{currentPillar.services}}" as="svc" hint-placeholder-count="6">
            <div data-on-click="{{svc.onClick}}" style="background:oklch(0.98 0.006 255);border-radius:14px;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
              <div style="padding-right:16px;">
                <div style="font-weight:700;font-size:15px;color:oklch(0.2 0.03 255);">{{svc.name}}</div>
                <div style="font-size:13px;color:oklch(0.48 0.02 255);margin-top:3px;line-height:1.4;">{{svc.blurb}}</div>
              </div>
              <div style="display:flex;align-items:center;gap:12px;flex:0 0 auto;">
                <sc-if value="{{svc.selected}}" hint-placeholder-val="{{false}}">
                  <div style="width:24px;height:24px;border-radius:999px;background:{{accentColor}};display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>
                  </div>
                </sc-if>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.65 0.02 255)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- SERVICE DETAIL -->
    <sc-if value="{{isService}}" hint-placeholder-val="{{false}}">
      <div class="view-pad" style="padding:36px 56px 48px;">
        <div style="display:flex;align-items:center;gap:14px;">
          <div data-on-click="{{backToPillar}}" style="width:36px;height:36px;border-radius:999px;background:oklch(0.22 0.03 255);display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </div>
          <div style="font-size:12px;font-weight:700;letter-spacing:.08em;color:{{accentColor}};text-transform:uppercase;">{{currentService.pillarName}}</div>
        </div>

        <div style="margin-left:50px;max-width:740px;">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;color:white;margin-top:6px;">{{currentService.name}}</div>
          <div style="margin-top:10px;font-size:15px;line-height:1.55;color:oklch(0.7 0.02 255);">{{currentService.blurb}}</div>

          <div style="margin-top:22px;background:oklch(0.19 0.03 255);border-radius:14px;padding:18px 22px;">
            <div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:{{accentColor}};text-transform:uppercase;margin-bottom:7px;">CodeBlue's Approach</div>
            <div style="font-size:13.5px;line-height:1.6;color:oklch(0.82 0.01 255);">{{currentService.methodology}}</div>
          </div>

          <sc-if value="{{currentService.hasPresentation}}" hint-placeholder-val="{{false}}">
            <div style="margin-top:26px;">
              <div style="font-size:11px;font-weight:700;letter-spacing:.08em;color:{{accentColor}};text-transform:uppercase;">{{currentService.presentationVM.eyebrow}}</div>
              <div style="margin-top:6px;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:white;">{{currentService.presentationVM.headline}}</div>
              <div style="margin-top:4px;font-size:14px;color:oklch(0.72 0.02 255);">{{currentService.presentationVM.tagline}}</div>
              <div style="margin-top:14px;font-size:13.5px;line-height:1.6;color:oklch(0.78 0.01 255);">{{currentService.presentationVM.intro}}</div>
              <div style="margin-top:16px;background:oklch(0.19 0.03 255);border-left:3px solid {{accentColor}};border-radius:10px;padding:16px 20px;">
                <div style="font-size:14.5px;font-style:italic;line-height:1.5;color:white;">“{{currentService.presentationVM.quote}}”</div>
                <div style="margin-top:8px;font-size:12px;color:oklch(0.6 0.02 255);">— {{currentService.presentationVM.quoteAttribution}}</div>
              </div>
              <div style="margin-top:14px;font-size:12.5px;line-height:1.55;color:oklch(0.62 0.02 255);">{{currentService.presentationVM.historyNote}}</div>

              <sc-for list="{{currentService.presentationVM.sections}}" as="sec" hint-placeholder-count="3">
                <div style="margin-top:30px;">
                  <div style="display:flex;align-items:baseline;gap:10px;">
                    <div style="font-size:12px;font-weight:700;color:{{accentColor}};">{{sec.number}}</div>
                    <div style="font-size:15px;font-weight:700;color:white;text-transform:uppercase;letter-spacing:.04em;">{{sec.title}}</div>
                  </div>

                  <sc-if value="{{sec.isCards}}" hint-placeholder-val="{{false}}">
                    <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;">
                      <sc-for list="{{sec.cards}}" as="c" hint-placeholder-count="3">
                        <div style="width:220px;background:oklch(0.98 0.006 255);border-radius:14px;padding:16px 18px;">
                          <div style="font-weight:700;font-size:14px;color:oklch(0.2 0.03 255);">{{c.title}}</div>
                          <div style="margin-top:6px;font-size:12.5px;line-height:1.5;color:oklch(0.42 0.02 255);">{{c.text}}</div>
                          <sc-if value="{{c.hasLines}}" hint-placeholder-val="{{false}}">
                            <div style="margin-top:8px;display:flex;flex-direction:column;gap:2px;">
                              <sc-for list="{{c.lines}}" as="ln" hint-placeholder-count="2">
                                <div style="font-size:12px;font-weight:600;color:{{accentColor}};">{{ln.text}}</div>
                              </sc-for>
                            </div>
                          </sc-if>
                        </div>
                      </sc-for>
                    </div>
                  </sc-if>

                  <sc-if value="{{sec.isBody}}" hint-placeholder-val="{{false}}">

                <div style="font-size:10.5px;font-weight:700;color:oklch(0.5 0.02 255);text-transform:uppercase;letter-spacing:.05em;">Required Hardware</div>
                <div style="margin-top:6px;font-size:16px;font-weight:700;color:oklch(0.2 0.03 255);">{{checkoutVM.hardwareMonthlyText}}</div>
                <sc-if value="{{checkoutVM.hasHardware}}" hint-placeholder-val="{{false}}">
                  <div style="margin-top:2px;font-size:11.5px;color:oklch(0.5 0.02 255);">{{checkoutVM.firewallLabel}}</div>
                </sc-if>
              </div>
              <div style="flex:1;min-width:150px;background:oklch(0.32 0.11 265);border-radius:12px;padding:14px 16px;">
                <div style="font-size:10.5px;font-weight:700;color:oklch(0.75 0.06 265);text-transform:uppercase;letter-spacing:.05em;">Total Monthly Investment</div>
                <div style="margin-top:6px;font-size:19px;font-weight:700;color:white;">{{checkoutVM.newMonthlyTotalText}}</div>
                <div style="margin-top:2px;font-size:11.5px;color:oklch(0.8 0.04 265);">+ {{checkoutVM.onboardingTotalText}} onboarding</div>
                <sc-if value="{{checkoutVM.hasOnboardingDiscount}}" hint-placeholder-val="{{false}}">
                  <div style="margin-top:2px;font-size:11.5px;color:oklch(0.85 0.08 155);">{{checkoutVM.onboardingDiscountText}}</div>
                </sc-if>
              </div>
              <sc-if value="{{checkoutVM.hasScopeGrandTotal}}" hint-placeholder-val="{{false}}">
                <div style="flex:1;min-width:150px;background:oklch(0.97 0.006 255);border-radius:12px;padding:14px 16px;">
                  <div style="font-size:10.5px;font-weight:700;color:oklch(0.5 0.02 255);text-transform:uppercase;letter-spacing:.05em;">Est. One-Time Scope of Work (Labor)</div>
                  <div style="margin-top:6px;font-size:16px;font-weight:700;color:oklch(0.2 0.03 255);">{{checkoutVM.scopeGrandTotalText}}</div>
                  <div style="margin-top:2px;font-size:11.5px;color:oklch(0.5 0.02 255);">Billed at {{checkoutVM.scopeRateText}} — see Solution Details below</div>
                </div>
              </sc-if>
            </div>
          </div>

          <sc-if value="{{checkoutVM.showOldVsNew}}" hint-placeholder-val="{{false}}">
            <div style="margin-top:26px;padding-top:20px;border-top:1px solid oklch(0.9 0.006 255);">
              <div style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;">Old vs. New Monthly Investment</div>
              <div style="margin-top:6px;font-size:13px;color:oklch(0.5 0.02 255);">What the customer reported spending on IT support today, compared to this proposal.</div>

              <sc-if value="{{checkoutVM.hasInvoiceBreakdown}}" hint-placeholder-val="{{false}}">
                <div style="margin-top:14px;display:flex;align-items:stretch;gap:16px;flex-wrap:wrap;">
                  <div style="flex:1;min-width:230px;background:oklch(0.97 0.006 255);border-radius:12px;padding:16px 18px;">
                    <div style="font-size:10.5px;font-weight:700;color:oklch(0.5 0.02 255);text-transform:uppercase;letter-spacing:.05em;">{{checkoutVM.invoiceVendorTitle}} — Current</div>
                    <sc-if value="{{checkoutVM.hasInvoiceBillingPeriod}}" hint-placeholder-val="{{false}}">
                      <div style="margin-top:2px;font-size:11px;color:oklch(0.55 0.02 255);">{{checkoutVM.invoiceBillingPeriodText}}</div>
                    </sc-if>
                    <div style="margin-top:10px;">
                      <sc-for list="{{checkoutVM.invoiceLineItemsC}}" as="li" hint-placeholder-count="3">
                        <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:oklch(0.4 0.02 255);padding:4px 0;border-bottom:1px solid oklch(0.92 0.006 255);">
                          <span>{{li.labelText}}</span><span style="flex:0 0 auto;">{{li.amountText}}</span>
                        </div>
                      </sc-for>
                    </div>
                    <div style="margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:oklch(0.3 0.02 255);">
                      <span>Total</span><span>{{checkoutVM.invoiceTotalText}}</span>
                    </div>
                    <sc-if value="{{checkoutVM.invoiceHasNotesC}}" hint-placeholder-val="{{false}}">
                      <div style="margin-top:8px;font-size:11px;color:oklch(0.55 0.02 255);font-style:italic;">{{checkoutVM.invoiceNotesTextC}}</div>
                    </sc-if>
                  </div>
                  <div style="flex:1;min-width:230px;background:oklch(0.97 0.006 255);border-radius:12px;padding:16px 18px;">
                    <div style="font-size:10.5px;font-weight:700;color:oklch(0.5 0.02 255);text-transform:uppercase;letter-spacing:.05em;">PeopleFirst Solution — New</div>
                    <div style="margin-top:10px;">
                      <sc-for list="{{checkoutVM.newSolutionLines}}" as="li" hint-placeholder-count="3">
                        <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:oklch(0.4 0.02 255);padding:4px 0;border-bottom:1px solid oklch(0.92 0.006 255);">
                          <span>{{li.labelText}}</span><span style="flex:0 0 auto;">{{li.amountText}}</span>
                        </div>
                      </sc-for>
                    </div>
                    <div style="margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:oklch(0.2 0.03 255);">
                      <span>Total</span><span>{{checkoutVM.newMonthlyTotalText}}</span>
                    </div>
                  </div>
                </div>
              </sc-if>

              <sc-if value="{{checkoutVM.noInvoiceBreakdown}}" hint-placeholder-val="{{false}}">
                <div style="margin-top:14px;display:flex;align-items:stretch;gap:12px;flex-wrap:wrap;">
                  <div style="flex:1;min-width:150px;background:oklch(0.97 0.006 255);border-radius:12px;padding:14px 16px;">
                    <div style="font-size:10.5px;font-weight:700;color:oklch(0.5 0.02 255);text-transform:uppercase;letter-spacing:.05em;">Current Monthly Spend</div>
                    <div style="margin-top:6px;font-size:19px;font-weight:700;color:oklch(0.4 0.02 255);">{{checkoutVM.currentSpendText}}</div>
                  </div>
                  <div style="flex:1;min-width:150px;background:oklch(0.97 0.006 255);border-radius:12px;padding:14px 16px;">
                    <div style="font-size:10.5px;font-weight:700;color:oklch(0.5 0.02 255);text-transform:uppercase;letter-spacing:.05em;">New Monthly Investment</div>
                    <div style="margin-top:6px;font-size:19px;font-weight:700;color:oklch(0.2 0.03 255);">{{checkoutVM.newMonthlyTotalText}}</div>
                  </div>
                </div>
              </sc-if>

              <div style="margin-top:12px;display:flex;align-items:stretch;gap:12px;flex-wrap:wrap;">
                <sc-if value="{{checkoutVM.isSavings}}" hint-placeholder-val="{{false}}">
                  <div style="flex:1;min-width:150px;background:oklch(0.93 0.06 155);border-radius:12px;padding:14px 16px;">
                    <div style="font-size:10.5px;font-weight:700;color:oklch(0.4 0.1 155);text-transform:uppercase;letter-spacing:.05em;">Monthly Savings</div>
                    <div style="margin-top:6px;font-size:19px;font-weight:700;color:oklch(0.35 0.12 155);">{{checkoutVM.monthlyDeltaText}}</div>
                  </div>
                </sc-if>
                <sc-if value="{{checkoutVM.isIncrease}}" hint-placeholder-val="{{false}}">
                  <div style="flex:1;min-width:150px;background:oklch(0.95 0.05 70);border-radius:12px;padding:14px 16px;">
                    <div style="font-size:10.5px;font-weight:700;color:oklch(0.45 0.12 55);text-transform:uppercase;letter-spacing:.05em;">Monthly Increase</div>
                    <div style="margin-top:6px;font-size:19px;font-weight:700;color:oklch(0.4 0.14 55);">{{checkoutVM.monthlyDeltaText}}</div>
                  </div>
                </sc-if>
              </div>
            </div>
          </sc-if>

          <div style="margin-top:26px;padding-top:20px;border-top:1px solid oklch(0.9 0.006 255);">
            <div style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;">Acceptance</div>
            <div style="margin-top:8px;font-size:12px;line-height:1.6;color:oklch(0.45 0.02 255);">This proposal, together with CodeBlue's Master Services Agreement and applicable Service Attachments (available at codebluetechnology.com/legal), forms the full Agreement between CodeBlue Technology and the customer identified above once accepted.</div>
            <div style="margin-top:30px;display:flex;gap:40px;">
              <div style="flex:1;">
                <div style="border-top:1px solid oklch(0.6 0.02 255);padding-top:6px;font-size:12px;color:oklch(0.5 0.02 255);">Authorized Contract Contact</div>
              </div>
              <div style="flex:1;">
                <div style="border-top:1px solid oklch(0.6 0.02 255);padding-top:6px;font-size:12px;color:oklch(0.5 0.02 255);">Date</div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </sc-if>

  </div>

  <!-- Generic image lightbox/modal — reusable by any feature via the
       imagePreview root state (see Component.openImagePreview in app.js).
       Dismiss by tapping the dim backdrop or the close button. -->
  <sc-if value="{{imagePreview.isOpen}}" hint-placeholder-val="{{false}}">
    <div data-on-click="{{imagePreview.onClose}}" style="position:fixed;inset:0;background:rgba(8,12,22,0.82);z-index:1000;display:flex;align-items:center;justify-content:center;padding:40px;">
      <div data-on-click="{{imagePreview.onStop}}" style="position:relative;max-width:min(640px, 90vw);max-height:90vh;display:flex;flex-direction:column;align-items:center;">
        <button data-on-click="{{imagePreview.onClose}}" aria-label="Close preview" style="position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:999px;background:white;border:none;color:oklch(0.2 0.03 255);font-size:16px;font-weight:700;cursor:pointer;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,0.4);">✕</button>
        <img src="{{imagePreview.url}}" alt="{{imagePreview.caption}}" style="display:block;max-width:100%;max-height:80vh;border-radius:14px;background:white;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,0.5);" />
        <sc-if value="{{imagePreview.hasCaption}}" hint-placeholder-val="{{false}}">
          <div style="margin-top:14px;font-size:13.5px;font-weight:700;color:white;text-align:center;">{{imagePreview.caption}}</div>
        </sc-if>
      </div>
    </div>
  </sc-if>

</div>
</script>

<script src="app.js?v=5522147"></script>

  (function () {
    var templateHtml = document.getElementById('app-template').textContent;
    var mountEl = document.getElementById('app-root');
    var component = window.SolutionsHubApp.createComponent({ accentColor: '#2f8fef' });
    SolutionsHubRuntime.mountApp(templateHtml, mountEl, component);
  })();
</script>
</body>
