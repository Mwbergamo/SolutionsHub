<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Register — CodeBlue Technology</title>
<!--
  This app no longer has its own login form (see register/api/auth.php)
  -- everyone signs in once via Microsoft 365 at the SolutionsHub root,
  and this page's only job now is to forward there with the right
  return_to so app.js's existing login redirect (unchanged) still lands
  back on this app afterward. The meta-refresh below is a no-JS fallback
  that ignores ?next and just returns to this app's index.html; the
  script is what actually resolves ?next correctly.
-->
<meta http-equiv="refresh" content="0; url=/login.php?return_to=%2Fregister%2Findex.html">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0d1117; font-family:'IBM Plex Sans',sans-serif; color:#8b949e; font-size:14px; }
</style>
</head>
<body>
  <div>Redirecting to Microsoft sign-in…</div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next') || 'index.html';
      // "next" is this app's own relative page (e.g. "index.html"); the
      // shared login only accepts a site-absolute return_to, so resolve it
      // against this app's own folder before handing it off.
      var returnTo = new URL(next, window.location.href).pathname;
      window.location.replace('/login.php?return_to=' + encodeURIComponent(returnTo));
    })();
  </script>
</body>
</html>
