<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Relationships</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: oklch(0.15 0.028 255); font-family: 'IBM Plex Sans', sans-serif; }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 380px; background: oklch(0.98 0.006 255); border-radius: 20px; padding: 32px 30px; }
  .title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: oklch(0.2 0.03 255); }
  .sub { margin-top: 6px; font-size: 13.5px; color: oklch(0.5 0.02 255); line-height: 1.5; }
  .tabs { margin-top: 22px; display: flex; gap: 6px; background: oklch(0.94 0.006 255); border-radius: 999px; padding: 4px; }
  .tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; font-size: 13px; font-weight: 700; color: oklch(0.45 0.02 255); cursor: pointer; user-select: none; }
  .tab.active { background: #2f8fef; color: white; }
  label { display: block; margin-top: 16px; font-size: 11.5px; font-weight: 700; color: oklch(0.5 0.02 255); text-transform: uppercase; letter-spacing: .04em; }
  input { margin-top: 5px; width: 100%; box-sizing: border-box; font-size: 14px; padding: 10px 12px; border: 1px solid oklch(0.85 0.006 255); border-radius: 8px; font-family: 'IBM Plex Sans', sans-serif; }
  .error { margin-top: 12px; font-size: 12.5px; font-weight: 600; color: oklch(0.55 0.18 30); min-height: 16px; }
  button.submit { margin-top: 18px; width: 100%; background: #2f8fef; border: none; color: white; font-size: 14px; font-weight: 700; padding: 12px 0; border-radius: 999px; cursor: pointer; }
  button.submit:disabled { opacity: .6; cursor: default; }
  .form { display: none; }
  .form.active { display: block; }
  .logo { text-align: center; margin-bottom: 4px; }
  .logo img { height: 30px; width: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo"><img src="assets/favicon.png" alt="" style="visibility:hidden;height:0;"></div>
    <div class="title">Relationships</div>
    <div class="sub">Sign in to see which CodeBlue services each customer already has — and what they're missing.</div>

    <div class="tabs">
      <div class="tab active" data-tab="login">Sign In</div>
      <div class="tab" data-tab="register">Create Account</div>
    </div>

    <form class="form active" id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
      <div class="error" id="loginError"></div>
      <button class="submit" type="submit" id="loginSubmit">Sign In</button>
    </form>

    <form class="form" id="registerForm">
      <label for="regName">Your Name</label>
      <input id="regName" type="text" autocomplete="name" required>
      <label for="regEmail">Email</label>
      <input id="regEmail" type="email" autocomplete="username" required>
      <label for="regPassword">Password</label>
      <input id="regPassword" type="password" autocomplete="new-password" minlength="8" required>
      <div class="error" id="registerError"></div>
      <button class="submit" type="submit" id="registerSubmit">Create Account</button>
    </form>
  </div>
</div>

<script>
(function () {
  var tabs = document.querySelectorAll('.tab');
  var forms = { login: document.getElementById('loginForm'), register: document.getElementById('registerForm') };
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      tabs.forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      Object.keys(forms).forEach(function (k) { forms[k].classList.toggle('active', k === t.dataset.tab); });
    });
  });

  function redirectTarget() {
    var params = new URLSearchParams(window.location.search);
    return params.get('next') || 'index.html';
  }

  function submitJson(url, body, btn, errEl) {
    btn.disabled = true;
    errEl.textContent = '';
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
      .then(function (r) {
        if (!r.data || r.data.ok !== true) {
          throw new Error((r.data && r.data.error) || 'Something went wrong — try again.');
        }
        window.location.href = redirectTarget();
      })
      .catch(function (err) {
        errEl.textContent = err.message || 'Something went wrong — try again.';
      })
      .finally(function () { btn.disabled = false; });
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    submitJson('api/auth.php?action=login', {
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value
    }, document.getElementById('loginSubmit'), document.getElementById('loginError'));
  });

  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    submitJson('api/auth.php?action=register', {
      name: document.getElementById('regName').value,
      email: document.getElementById('regEmail').value,
      password: document.getElementById('regPassword').value
    }, document.getElementById('registerSubmit'), document.getElementById('registerError'));
  });

  // Already signed in? Skip straight past the login screen.
  fetch('api/auth.php?action=me').then(function (r) { return r.json(); }).then(function (data) {
    if (data && data.ok && data.user) {
      window.location.href = redirectTarget();
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
