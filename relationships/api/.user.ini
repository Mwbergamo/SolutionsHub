; relationships/api/.user.ini
;
; Raises the upload limits for this directory only, so the risk-scan zip
; upload (risk-scans.php, added 2026-09-23) isn't silently capped by
; Bluehost's small shared-hosting defaults (typically well under 100M).
; Applies only if this account's PHP runs as FastCGI/PHP-FPM, which is the
; normal setup when a cPanel account lets you pick a PHP version -- if
; uploads still fail with a "too large" error after this, check cPanel ->
; MultiPHP INI Editor and raise the same two values there instead, since a
; suPHP/mod_php setup won't read this file at all.
;
upload_max_filesize = 300M
post_max_size = 310M
max_execution_time = 300
max_input_time = 300
memory_limit = 320M
