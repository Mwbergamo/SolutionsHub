<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Sheet Sign Up — CodeBlue Technology</title>
<meta name="description" content="CodeBlue Technology rate sheet sign up.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module">
  /**
   * Alternative Payments' Web SDK (@getalternative/partner-sdk) is an
   * npm-only package (no documented CDN/UMD build) -- added 2026-09-17
   * (follow-up #3) after the earlier hand-rolled Evervault mount turned
   * out not to be a supported integration path (see api/altpay.php's
   * header). Loaded here via jsDelivr's "+esm" endpoint, which bundles
   * an npm package (including its own dependencies, e.g. React -- this
   * SDK renders its own UI) into a single browser-ready ES module, since
   * this site has no build step / bundler of its own.
   *
   * window.__altpaySdkReady is a promise signup.js awaits before mounting
   * the card form -- resolves to { ok: true, AlternativeClient } or
   * { ok: false, error } so signup.js can show a real error instead of
   * failing silently if the CDN or the package ever misbehaves.
   */
  window.__altpaySdkReady = (async function () {
    try {
      var mod = await import('https://cdn.jsdelivr.net/npm/@getalternative/partner-sdk@0.1.7/+esm');
      if (!mod || !mod.AlternativeClient) {
        return { ok: false, error: new Error('Alternative Payments SDK module loaded but did not export AlternativeClient.') };
      }
      return { ok: true, AlternativeClient: mod.AlternativeClient };
    } catch (err) {
      return { ok: false, error: err };
    }
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #F4F5F7; font-family: 'IBM Plex Sans', sans-serif; color: #1B2030; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
  .letterhead { border-bottom: 3px solid #182857; padding-bottom: 16px; margin-bottom: 24px; }
  .letterhead .name { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #182857; }
  .letterhead .sub { font-size: 13px; color: #5A6472; margin-top: 4px; }
  .card { background: white; border-radius: 12px; border: 1px solid #E2E5EA; padding: 24px; margin-bottom: 20px; }
  .rate-highlight { font-size: 26px; font-weight: 800; color: #182857; }
  .rate-highlight span { font-size: 13px; font-weight: 400; color: #5A6472; }
  .field-label { display: block; font-size: 12.5px; font-weight: 700; color: #33394A; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .02em; }
  .field-label:first-of-type { margin-top: 0; }
  .hint { font-size: 12px; color: #8A93A3; margin-top: 4px; }
  input[type=text], input[type=email], select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #D3D8E0;
    background: white; font-size: 14px; font-family: inherit; color: #1B2030;
  }
  .row2 { display: flex; gap: 12px; }
  .row2 > div { flex: 1; }
  .radio-row, .method-row { display: flex; gap: 16px; margin-top: 4px; flex-wrap: wrap; }
  .radio-option, .method-option { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; cursor: pointer; border: 1px solid #D3D8E0; border-radius: 8px; padding: 10px 14px; flex: 1; min-width: 180px; }
  .method-option .method-note { display: block; font-size: 11.5px; color: #5A6472; margin-top: 2px; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; }
  .checkbox-row input { margin-top: 3px; }
  .checkbox-row label { font-size: 12.5px; color: #33394A; line-height: 1.5; }
  .legal-block { font-size: 11.5px; color: #5A6472; line-height: 1.6; white-space: pre-wrap; background: #F8F9FB; border: 1px dashed #D3D8E0; border-radius: 8px; padding: 14px; }
  .sig-wrap { border: 1px solid #D3D8E0; border-radius: 8px; background: #fff; touch-action: none; }
  canvas#sig-pad { width: 100%; height: 180px; display: block; cursor: crosshair; }
  .sig-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .clear-sig-btn { background: transparent; border: none; color: #2f6fe0; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 4px; }
  .payment-note { font-size: 12px; color: #5A6472; background: #EEF3FC; border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .card-form-mount { min-height: 44px; margin-top: 14px; }
  .card-form-loading { font-size: 12.5px; color: #8A93A3; margin-top: 14px; }
  .card-form-error { font-size: 12.5px; color: #A6362B; margin-top: 14px; }
  .bank-fields { margin-top: 14px; }
  .bank-fields .row2 { margin-top: 8px; }
  .account-type-row { display: flex; gap: 16px; margin-top: 8px; }
  .account-type-row label { display: flex; align-items: center; gap: 6px; font-size: 13.5px; cursor: pointer; }
  .submit-btn { margin-top: 24px; width: 100%; background: #182857; border: none; color: white; font-size: 15px; font-weight: 700; padding: 14px 18px; border-radius: 999px; cursor: pointer; }
  .submit-btn:disabled { opacity: .6; cursor: default; }
  .error-banner { margin: 0 0 18px; padding: 12px 16px; background: #FBE6E4; border: 1px solid #E5534B; color: #8a2a24; border-radius: 10px; font-size: 13.5px; }
  .success-card { text-align: center; padding: 40px 24px; }
  .success-card .big { font-size: 40px; }
  .footer-contact { text-align: center; font-size: 12px; color: #8A93A3; margin-top: 24px; }
</style>
</head>
<body>
<div id="app-root">
  <div class="wrap"><div class="card" style="text-align:center;color:#5A6472;">Loading…</div></div>
</div>
<script src="signup.js?v=6"></script>
</body>
</html>
